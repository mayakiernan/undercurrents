groups.forEach((g,i)=>{const cluster=document.createElement('div');cluster.className='cluster';cluster.innerHTML=`<div class="hub"><h2>${g.title}</h2></div>`;g.ids.forEach((id,j)=>{const p=people[id],b=document.createElement('button');b.className='person'+(j<2?' upper':'')+((j===2||i===1&&(j===3||j===4))?' edge-right':'')+((i===1?j>=5:j>=4)?' edge-left':'');b.style.setProperty('--size',([86,70,92,76,82,66][(j+i*2)%6])+'px');const pos=i===1?researchPositions[j]:positions[j];b.style.setProperty('--x',pos[0]+'%');b.style.setProperty('--y',pos[1]+'%');b.setAttribute('aria-label',[p.Name,p['General role'],p.Organization].filter(Boolean).join(', '));b.setAttribute('aria-expanded','false');const initials=document.createElement('span');initials.className='initials';initials.textContent=p.Name.split(' ').map(x=>x[0]).slice(0,2).join('');b.append(initials);if(p.photo){const img=document.createElement('img');img.src=p.photo;img.alt='';img.onerror=()=>img.remove();b.append(img)}const bubble=document.createElement('span');bubble.className='bubble';for(const [tag,cls,value] of [['strong','',p.Name],['span','role',p['General role']],['span','org',p.Organization]]){if(!value)continue;const el=document.createElement(tag);el.className=cls;el.textContent=value;bubble.append(el)}b.append(bubble);b.addEventListener('click',()=>{const was=b.classList.contains('open');closeAll();if(!was){b.classList.add('open');b.setAttribute('aria-expanded','true')}});cluster.append(b)});map.append(cluster)});
function closeAll(){document.querySelectorAll('.person.open').forEach(b=>{b.classList.remove('open');b.setAttribute('aria-expanded','false')})}document.addEventListener('click',e=>{if(!e.target.closest('.person'))closeAll()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAll();document.activeElement.blur()}});
