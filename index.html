<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#ffffff"/><title>UNDERCURRENTS — Desert film edition</title><link rel="icon" href="./favicon.ico" sizes="32x32"/><link rel="icon" href="./favicon.svg" type="image/svg+xml"/><link rel="apple-touch-icon" href="./apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#ffffff;color:#171815;font-family:Inter,Arial,sans-serif}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit}.scroll-stage{height:210svh;position:relative}.hero{position:sticky;top:0;height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}.title{position:absolute;left:3%;width:94%;top:50%;transform:translateY(-50%);margin:0;font-size:12.5vw;line-height:1.05;font-weight:400;letter-spacing:-.085em;text-align:center;white-space:nowrap}.title span{display:block;will-change:transform}.hero-footer{position:absolute;bottom:30px;left:38px;right:38px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.scroll-cue{display:flex;gap:24px;align-items:center}.scroll-cue b{font-size:22px;font-weight:400}@media(max-width:600px){.hero-footer{left:24px;right:24px;bottom:24px;font-size:8px}.scroll-cue{gap:12px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.title span{transform:none!important}}

.hand-letter{display:inline;opacity:0;animation:write-letter .18s ease-out forwards;animation-delay:calc(var(--i) * 85ms + 400ms)}
@keyframes write-letter{to{opacity:1}}

.title{font-size:11.8vw;letter-spacing:-.07em}

.projects{padding:80px 4% 100px;background:#fff;color:#000;scroll-margin-top:75px}
.projects-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:32px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}

.project-grid{display:grid;grid-template-columns:1.08fr 1fr 1fr;gap:24px;align-items:start}
.project{background:#fff;box-shadow:0 3px 18px rgba(0,0,0,.09);padding:24px;position:relative;min-width:0;overflow:hidden}

.project-heading{display:flex;justify-content:space-between;align-items:start;gap:24px}

@media(max-width:850px){.project-grid{grid-template-columns:1fr 1fr}.project-grown{min-height:700px}.project-three{grid-column:1}.project-four{grid-column:2;display:block}.project-two{margin-top:70px}.project h3{font-size:42px}.project-four .empty-space{height:160px}}
@media(max-width:560px){.projects{padding:65px 22px}.project-grid{grid-template-columns:1fr;gap:24px}.project{grid-column:1;margin-top:0;padding:22px}.project-grown{min-height:620px}.cotton-image{height:350px}.project-grown p{padding-top:70px}.project h3{font-size:44px}.empty-space{height:180px}.project-four .empty-space{height:180px}}
.landing-note{font-family:Inter,Arial,sans-serif;font-style:italic;font-size:clamp(24px,3.2vw,54px);letter-spacing:-.04em}
@media(max-width:600px){.landing-note{font-size:6vw}}

.site-footer{position:relative;isolation:isolate;min-height:640px;height:75svh;max-height:1000px;padding:clamp(90px,14vh,170px) 9.5% 100px;display:flex;justify-content:space-between;align-items:flex-start;gap:50px;color:#fff;background:#16272c;overflow:hidden}

@media(max-width:650px){.site-footer{min-height:560px;height:75svh;padding:76px 7% 80px;gap:60px;flex-direction:column;justify-content:flex-start}.footer-copyright{font-size:11px}.footer-navigation{align-self:flex-end;min-width:130px;gap:30px}.footer-navigation a{font-size:16px}.site-footer::before{background-position:42% center}}

.landing-note{font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;font-style:normal;font-weight:400;font-size:clamp(24px,3.2vw,54px);letter-spacing:-.025em;line-height:1.15;transform:none}

.smoke-title{overflow:visible}

.title .smoke-vapor{position:absolute;inset:0;display:block;white-space:nowrap;filter:url(#title-smoke);pointer-events:none;will-change:transform,opacity}

/* Three times the scroll distance for the title and subtitle fade. */
.scroll-stage{height:430svh}

.project-built-in .project-heading{gap:18px}
.project-built-in .project-heading p{font-size:12px;line-height:1.4;text-align:left;max-width:240px}

.project-built-in h3{font-size:clamp(36px,4.1vw,66px);white-space:nowrap;margin-top:auto}

/* Project filters — same button language as the site header nav. */
.projects-label{gap:24px;flex-wrap:wrap;align-items:center}
.project-filters{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.project-filter{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid #0000002e;background:#fff;color:#000;font:500 11px/1 Inter,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:border-color .15s,background-color .15s,color .15s}
.project-filter:hover{border-color:#000}

.project-filter-count{font-size:9px;letter-spacing:.04em;opacity:.55}
.projects-count{min-width:72px;text-align:right}
/* A filtered list drops the staggered editorial layout for an even grid. */
.project-grid.is-filtered{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}
.project-grid.is-filtered .project{grid-column:auto;grid-row:auto;margin-top:0;min-height:540px}

@media(max-width:640px){.projects{scroll-margin-top:68px}}

.project-annual-bet{display:flex;flex-direction:column;text-decoration:none;color:#000}
.project-annual-bet .hail-graphic{display:block;width:100%;height:auto;margin:36px 0 40px}

@media(max-width:850px){.project-paid .tile-map{margin:28px 0}}
